<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="276" viewBox="0 0 1120 276" role="img" aria-labelledby="title desc">
  <title id="title">Research workflow — animated terminal</title>
  <desc id="desc">A stylized terminal types a research workflow: reproduce the failure, trace its root cause, validate a targeted change, and share the evidence upstream. This is an illustration, not a live command session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c27"/>
      <stop offset="1" stop-color="#0d1520"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#648184" stroke-opacity=".065"/>
    </pattern>
    <clipPath id="bounds"><rect width="1120" height="276" rx="15"/></clipPath>
    <clipPath id="reveal-0"><rect class="type-0" x="73" y="72" width="550" height="28"/></clipPath>
    <clipPath id="reveal-1"><rect class="type-1" x="50" y="109" width="325" height="28"/></clipPath>
    <clipPath id="reveal-2"><rect class="type-2" x="50" y="146" width="313" height="28"/></clipPath>
    <clipPath id="reveal-3"><rect class="type-3" x="50" y="183" width="388" height="28"/></clipPath>
    <clipPath id="reveal-4"><rect class="type-4" x="50" y="220" width="400" height="28"/></clipPath>
  </defs>
  <style>
    @keyframes type-0 {
      0%, 2% { width: 0px; animation-timing-function: steps(44, end); }
      22%, 97% { width: 550px; }
      100% { width: 0px; }
    }
    .type-0 { animation: type-0 14s infinite; }
    @keyframes type-1 {
      0%, 25% { width: 0px; animation-timing-function: steps(26, end); }
      40%, 97% { width: 325px; }
      100% { width: 0px; }
    }
    .type-1 { animation: type-1 14s infinite; }
    @keyframes type-2 {
      0%, 43% { width: 0px; animation-timing-function: steps(25, end); }
      58%, 97% { width: 313px; }
      100% { width: 0px; }
    }
    .type-2 { animation: type-2 14s infinite; }
    @keyframes type-3 {
      0%, 61% { width: 0px; animation-timing-function: steps(31, end); }
      76%, 97% { width: 388px; }
      100% { width: 0px; }
    }
    .type-3 { animation: type-3 14s infinite; }
    @keyframes type-4 {
      0%, 79% { width: 0px; animation-timing-function: steps(32, end); }
      92%, 97% { width: 400px; }
      100% { width: 0px; }
    }
    .type-4 { animation: type-4 14s infinite; }
    @keyframes cursor-flash {
      0%, 78% { opacity: 0; }
      79%, 83%, 87%, 91%, 95% { opacity: 1; }
      81%, 85%, 89%, 93%, 97%, 100% { opacity: 0; }
    }
    .cursor { animation: cursor-flash 14s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .type-0, .type-1, .type-2, .type-3, .type-4, .cursor { animation: none !important; }
      .cursor { opacity: 1; }
    }
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1120" height="276" fill="url(#bg)"/>
    <rect width="1120" height="276" fill="url(#grid)"/>
    <rect x="1" y="1" width="1118" height="274" rx="14" fill="none" stroke="#425763" stroke-width="2"/>
    <rect width="1120" height="45" fill="#182936"/>
    <path d="M0 45H1120" stroke="#3b515c"/>
    <circle cx="26" cy="23" r="5.5" fill="#f0ae7d"/>
    <circle cx="47" cy="23" r="5.5" fill="#e8c984"/>
    <circle cx="68" cy="23" r="5.5" fill="#73dab0"/>
    <text x="103" y="29" fill="#c0d2d1" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="1">FIELD NOTES / RESEARCH LOOP</text>
    <text x="1083" y="29" text-anchor="end" fill="#7a9b9e" font-family="Consolas, Menlo, monospace" font-size="13">illustrative session</text>
    <path d="M817 64V253" stroke="#304956" stroke-width="1"/>
    <text x="50" y="94" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7ce9c1">$</text>
      <text x="73" y="94" fill="#eaf4f1" font-size="20" font-family="Consolas, Menlo, monospace" clip-path="url(#reveal-0)">./investigate --reproduce --trace --validate</text>
      <text x="50" y="131" fill="#c1d0ce" font-size="20" font-family="Consolas, Menlo, monospace" clip-path="url(#reveal-1)">[01] reproduce the failure</text>
      <text x="50" y="168" fill="#c1d0ce" font-size="20" font-family="Consolas, Menlo, monospace" clip-path="url(#reveal-2)">[02] trace the root cause</text>
      <text x="50" y="205" fill="#c1d0ce" font-size="20" font-family="Consolas, Menlo, monospace" clip-path="url(#reveal-3)">[03] validate a targeted change</text>
      <text x="50" y="242" fill="#8eecc8" font-size="20" font-family="Consolas, Menlo, monospace" clip-path="url(#reveal-4)">[04] share the evidence upstream</text>
    <rect class="cursor" x="446" y="226" width="11" height="21" fill="#70e7c1" opacity="0"/>
    <text x="850" y="86" font-family="Consolas, Menlo, monospace" fill="#f0ba78" font-size="14" letter-spacing="1.3">WORKBENCH</text>
    <text x="850" y="124" font-family="Consolas, Menlo, monospace" fill="#dce8e5" font-size="19">C / GDB</text>
    <text x="850" y="159" font-family="Consolas, Menlo, monospace" fill="#dce8e5" font-size="19">NFC / HARDWARE</text>
    <text x="850" y="194" font-family="Consolas, Menlo, monospace" fill="#dce8e5" font-size="19">PROTOCOLS</text>
    <text x="850" y="229" font-family="Consolas, Menlo, monospace" fill="#70e7c1" font-size="19">OPEN SOURCE</text>
    <path d="M850 243H1070" stroke="#355249"/>
  </g>
</svg>
