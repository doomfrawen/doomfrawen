      <circle cx="23" cy="21" r="5" fill="#f1ae7a"/>
      <circle cx="41" cy="21" r="5" fill="#e6ce8b"/>
      <circle cx="59" cy="21" r="5" fill="#72d7af"/>
      <text x="197" y="26" font-family="Consolas, Menlo, monospace" font-size="13" fill="#90a8b1" text-anchor="middle">research / notes</text>
      <text x="26" y="83" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6ce0ba">$</text>
      <text x="49" y="83" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e9efef">cat focus.txt</text>
      <text x="26" y="119" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fb5b9">01</text>
      <text x="61" y="119" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e7ecea">reproduce the issue</text>
      <text x="26" y="151" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fb5b9">02</text>
      <text x="61" y="151" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e7ecea">trace the behavior</text>
      <text x="26" y="183" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fb5b9">03</text>
