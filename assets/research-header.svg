<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc">
  <title id="title">doomfrawen — Find the edge case. Follow the evidence.</title>
  <desc id="desc">Custom dark technical banner for security research, debugging, reverse engineering, and open source work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1721"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1078 100) rotate(90) scale(260 320)">
      <stop stop-color="#267363" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#267363" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#8ea6a2" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#70e7c1"/>
      <stop offset="1" stop-color="#70e7c1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="350" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
