    <text x="57" y="104" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#f4bb77">SECURITY ENGINEERING / FIELD NOTES</text>

    <text x="54" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="800" letter-spacing="-1.6" fill="#f3f6f5">Find the edge case.</text>
    <text x="54" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="800" letter-spacing="-1.6" fill="#70e7c1">Follow the evidence.</text>

    <rect x="57" y="265" width="535" height="1.5" fill="url(#rule)"/>
    <text x="57" y="299" font-family="Consolas, Menlo, monospace" font-size="15" fill="#adbfbe">AppSec   /   Reverse engineering   /   Open source</text>

