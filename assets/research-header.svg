    <rect width="1280" height="350" fill="url(#grid)"/>
    <rect width="1280" height="350" fill="url(#glow)"/>
    <rect width="1280" height="350" fill="none" stroke="#3b535c" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="350" fill="#70e7c1"/>

    <circle cx="57" cy="49" r="6" fill="#70e7c1"/>
